<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#121a32" />
    <title>Sala | Ronda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="site-body room-body">
    <main id="joinRoomView" class="room-join"><section class="access-card"><a class="brand" href="index.html"><span class="brand-mark"></span>Ronda</a><p class="kicker">UNIRSE A LA SALA</p><h1 id="joinRoundTitle">Cargando ronda...</h1><form id="roomJoinForm" class="stack-form"><label for="guestName">Tu nombre</label><input id="guestName" maxlength="80" autocomplete="name" required placeholder="¿Cómo te llamas?" /><button class="button button-primary" type="submit">Entrar a la sala</button><p id="roomJoinMessage" class="form-message"></p></form></section></main>
    <main id="roomView" class="room-layout is-hidden"><header class="app-header"><a class="brand" href="index.html"><span class="brand-mark"></span>Ronda</a><span id="roomCode" class="status-chip">------</span></header><section class="room-stage"><div class="room-heading"><p class="kicker">RONDA EN VIVO</p><h1 id="roomTitle">Mi ronda</h1><p id="roomStatus">Esperando a que el administrador inicie la ronda...</p></div><div id="roomWheelStage" class="wheel-stage participant-wheel"><div class="wheel-pointer"></div><canvas id="roomWheel" width="720" height="720" aria-label="Ruleta en vivo"></canvas><div class="wheel-hub"><span id="roomWheelCount">0</span><small>opciones</small></div></div><section class="connected-panel"><div><p class="kicker">CONECTADOS</p><strong id="connectedCount">0 participantes conectados</strong></div><ul id="roomPresenceList" class="presence-list"></ul></section></section></main>
    <section id="roomWinnerOverlay" class="winner-overlay is-hidden" aria-live="assertive"><div id="roomConfettiLayer" class="confetti-layer"></div><div class="winner-content"><p>🎉 TENEMOS GANADOR</p><h2 id="roomWinnerName"></h2><span id="roomWinnerDetail"></span><button id="roomCloseWinner" class="button button-dark" type="button">Seguir viendo</button></div></section>
    <script type="module" src="room.js"></script>
  </body>
</html>
