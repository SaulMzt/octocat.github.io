<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1017" />
    <link rel="icon" type="image/svg+xml" href="assets/icons/pumpkin.svg" />
    <title>Ronda Halloween | Entrar a la sala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260925-1" />
  </head>
  <body class="site-body">
    <main class="landing">
      <canvas id="entryScene" class="entry-scene" aria-hidden="true"></canvas>
      <nav class="topbar" aria-label="Navegación principal">
        <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>RONDA <small>HALLOWEEN</small></a>
        <a class="text-link" href="admin.html">Administrar</a>
      </nav>
      <section class="join-content">
        <p class="kicker">LA NOCHE ESTÁ POR COMENZAR</p>
        <h1>Ronda Halloween</h1>
        <form id="joinForm" class="stack-form" novalidate>
          <label for="roundCode">Código de la ronda</label>
          <input id="roundCode" name="roundCode" class="code-input" type="text" autocomplete="off" maxlength="6" placeholder="A7K92X" aria-describedby="joinMessage" />
          <button class="button button-primary button-large" type="submit">Entrar a la sala</button>
          <p id="joinMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script type="module" src="app.js?v=20260925-1"></script>
    <script type="module" src="js/entry-scene.js?v=20260925-2"></script>
